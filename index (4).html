<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Games</title>
  <style>
    :root {
      --bg: #14121f;
      --panel: #221f35;
      --text: #f1eefb;
      --muted: #a29ec0;
      --accent: #ffb454;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 900px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 8px; }
    p.intro { color: var(--muted); margin: 0 0 32px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .game {
      display: block;
      background: var(--panel);
      border-radius: 10px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
      border: 2px solid transparent;
    }
    .game:hover, .game:focus-visible { border-color: var(--accent); outline: none; }
    .game h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .game p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>My Games</h1>
    <p class="intro">Pick a game to play in your browser.</p>

    <div class="grid">
      <!-- Copy this block for each new game. Change the href to the game's folder. -->
      <a class="game" href="games/my-game/">
        <h2>My Game</h2>
        <p>Short description of the game.</p>
      </a>

      <!--
      <a class="game" href="games/another-game/">
        <h2>Another Game</h2>
        <p>Short description.</p>
      </a>
      -->
    </div>
  </main>
</body>
</html>
